[project]
name = "local-voc-archive"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2,<3",
  "psycopg[binary]>=3,<4",
  "fastapi>=0.115,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "localdb: requires the local training PostgreSQL database",
]
